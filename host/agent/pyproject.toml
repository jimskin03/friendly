[project]
name = "friendly-host-agent"
version = "0.1.0"
description = "Friendly companion host Control API (Xvfb + FastAPI)"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.0",
  "Pillow>=10.4.0",
  "httpx>=0.27.0",
  "mcp>=1.8.0",
  "PyJWT>=2.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27.0"]

[tool.uvicorn]
factory = false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
