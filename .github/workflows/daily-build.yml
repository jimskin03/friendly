name: Daily Build

on:
  # Daily at 09:00 and 18:00 UTC (17:00 and 02:00 MYT)
  schedule:
    - cron: '0 9,18 * * *'
  # Also allow a manual run
  workflow_dispatch:

jobs:
  # Skip the build when there were no commits in the last 24 hours
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for recent commits
        id: check
        run: |
          # A manual run always builds
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Scheduled run: build only if there is a commit from the last 24 hours
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "No commits in the last 24 hours, skipping the build"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to publish the release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive # Fetch submodules

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # The web module's preBuild runs `pnpm run build`, so Node and pnpm must be ready
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # Gradle's buildWebUi task only runs build, not install, so install dependencies here first
      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Decode the base64 keystore. Skip when unset so we never write a 0-byte file.
          if [ -n "$KEY_BASE64" ]; then
            echo "$KEY_BASE64" | base64 -d > app/app.key
          else
            rm -f app/app.key
            echo "KEY_BASE64 secret not set; skipping release keystore extraction."
          fi

          # Write the signing config to local.properties. Skip when unset so Gradle falls back to debug signing.
          if [ -n "$SIGNING_CONFIG" ]; then
            echo "$SIGNING_CONFIG" >> local.properties
          else
            echo "SIGNING_CONFIG secret not set; release build will fallback to debug signing."
          fi

          # Firebase is optional. An empty or non-JSON secret must not create a file, or
          # processReleaseGoogleServices fails with "Malformed root json".
          if [ -n "$GOOGLE_SERVICES_JSON" ] && printf '%s\n' "$GOOGLE_SERVICES_JSON" | python3 -c 'import json,sys; json.load(sys.stdin)' ; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            rm -f app/google-services.json
            echo "Skipping Firebase: GOOGLE_SERVICES_JSON missing or not valid JSON"
          fi

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      # Publish the APKs as a prerelease so each file can be downloaded directly
      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: nightly            # Fixed tag, overwritten by each nightly
          name: Nightly Build
          prerelease: true
          body: |
            Automatic daily build (commit `${{ github.sha }}`)

            > Development build. It may be unstable and is for testing only.
          files: app/build/outputs/apk/release/*.apk
