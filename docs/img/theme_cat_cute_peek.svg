    <path d="M110 196 C110 180 88 176 82 192 C76 208 98 222 110 234 C122 222 144 208 138 192 C132 176 110 180 110 196 Z" fill="#FFE1D2" stroke="#E07F4F" stroke-width="6"/>
    <path d="M78 252 L100 248" stroke="#E9925E" stroke-width="5"/><path d="M86 268 L104 262" stroke="#E9925E" stroke-width="5"/>
